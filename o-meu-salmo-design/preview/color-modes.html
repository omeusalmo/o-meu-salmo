<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;}
  .wrap{display:flex;}
  .pane{flex:1;padding:16px 18px;}
  .night{background:#080B1C;} .day{background:#F5F7FE;}
  .ttl{font-size:9px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:10px;}
  .night .ttl{color:#353C73;} .day .ttl{color:#8C97D4;}
  .row{display:flex;gap:0;border-radius:8px;overflow:hidden;}
  .sw{flex:1;height:42px;}
  .cap{display:flex;justify-content:space-between;margin-top:6px;font-size:8.5px;font-family:monospace;}
  .night .cap{color:#8C97D4;} .day .cap{color:#8C97D4;}
</style></head>
<body><div class="wrap">
  <div class="pane night">
    <div class="ttl">◐ Noturno</div>
    <div class="row">
      <div class="sw" style="background:#080B1C;box-shadow:inset 0 0 0 .5px #1E2348"></div>
      <div class="sw" style="background:#10142C"></div>
      <div class="sw" style="background:#1E2348"></div>
      <div class="sw" style="background:#353C73"></div>
      <div class="sw" style="background:#8C97D4"></div>
      <div class="sw" style="background:#EEF0FC"></div>
    </div>
    <div class="cap"><span>base</span><span>plus</span><span>line</span><span>muted</span><span>text</span><span>cream</span></div>
  </div>
  <div class="pane day">
    <div class="ttl">○ Diurno</div>
    <div class="row">
      <div class="sw" style="background:#F5F7FE;box-shadow:inset 0 0 0 .5px #D5DCF3"></div>
      <div class="sw" style="background:#E9EDFD"></div>
      <div class="sw" style="background:#D5DCF3"></div>
      <div class="sw" style="background:#8C97D4"></div>
      <div class="sw" style="background:#2E3A86"></div>
      <div class="sw" style="background:#0C1230"></div>
    </div>
    <div class="cap"><span>base</span><span>plus</span><span>line</span><span>muted</span><span>text</span><span>title</span></div>
  </div>
</div></body></html>
