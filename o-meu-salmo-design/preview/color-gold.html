</style></head>
<body><div class="wrap">
  <div class="col">

    <div class="cap"><b>#C4A86A</b> sobre escuro · AAA 8.5:1</div>
  </div>
  <div class="col">
    <div class="tile" style="background:#F5F7FE;border:.5px solid #D5DCF3"><span style="font-family:'Cormorant',serif;font-style:italic;font-size:19px;color:#8A6A28">Aquietai-vos…</span></div>
    <div class="cap"><b>#8A6A28</b> sobre claro · AA 4.7:1</div>
  </div>
  <div class="col" style="justify-content:center;max-width:150px">
