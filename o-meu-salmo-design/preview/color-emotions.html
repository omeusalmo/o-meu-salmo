<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  body{margin:0;font-family:'Instrument Sans',system-ui,sans-serif;background:#fff;}
  .wrap{padding:18px 20px;display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:flex;align-items:center;gap:7px;border-radius:999px;padding:8px 14px;}
  .chip span{width:8px;height:8px;border-radius:50%;}
  .chip b{font-size:13px;font-weight:500;}
</style></head>
<body><div class="wrap">
  <div class="chip" style="background:#EEEDF8"><span style="background:#5567EA"></span><b style="color:#3D3889">Ansiedade</b></div>
  <div class="chip" style="background:#EAF1E6"><span style="background:#6A9A62"></span><b style="color:#4E7A52">Paz</b></div>
  <div class="chip" style="background:#FAF2E0"><span style="background:#C99A38"></span><b style="color:#9A7320">Gratidão</b></div>
  <div class="chip" style="background:#F1EBEF"><span style="background:#9A6A86"></span><b style="color:#7A4A66">Luto</b></div>
  <div class="chip" style="background:#ECECF2"><span style="background:#8480AA"></span><b style="color:#5E5A82">Dúvida</b></div>
</div></body></html>
