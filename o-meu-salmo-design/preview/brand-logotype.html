<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Instrument+Sans:wght@400&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fff;}
  .wrap{padding:22px;display:flex;gap:30px;align-items:center;}
  .lt{display:flex;flex-direction:column;align-items:flex-start;line-height:1;}
  .o-meu{font-family:'Instrument Sans',sans-serif;font-weight:400;font-size:15px;letter-spacing:.34em;text-transform:uppercase;padding-left:.34em;margin-bottom:9px;white-space:nowrap;color:#2E3A86;}
  .salmo{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:62px;letter-spacing:-.015em;line-height:.86;color:#2A47DD;}
  .cap{font-family:'Instrument Sans',sans-serif;font-size:10px;color:#999;line-height:1.5;max-width:150px;}
  .cap b{color:#2A47DD;font-weight:500;}
</style></head>
<body><div class="wrap">
  <div class="lt"><div class="o-meu">O meu</div><div class="salmo">Salmo</div></div>
  <div class="cap"><b>Logotipo primário.</b> "O MEU" versalete à esquerda sobre "Salmo" Playfair itálico. Para site & LP.</div>
</div></body></html>
