<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;font-family:var(--font-ui);background:#fff;}
  .wrap{padding:18px 20px;}
  .row{display:flex;gap:0;border-radius:10px;overflow:hidden;}
  .sw{flex:1;height:64px;display:flex;align-items:flex-end;padding:7px 9px;}
  .sw small{font-size:9px;font-family:monospace;}
  .lbl{display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:#555;font-family:monospace;}
</style></head>
<body><div class="wrap">
  <div class="row">
    <div class="sw" style="background:#EEEDF8"><small style="color:#1B33B4">100</small></div>
    <div class="sw" style="background:#C9C7EE"><small style="color:#1B33B4">200</small></div>
    <div class="sw" style="background:#A29FE0"><small style="color:#0C1230">300</small></div>
    <div class="sw" style="background:#5567EA"><small style="color:#fff">400</small></div>
    <div class="sw" style="background:#2A47DD;flex:1.4"><small style="color:#fff">★ 500</small></div>
    <div class="sw" style="background:#1B33B4"><small style="color:#fff">600</small></div>
    <div class="sw" style="background:#142A8C"><small style="color:#fff">700</small></div>
  </div>
  <div class="lbl"><span>#EEEDF8</span><span style="color:#2A47DD">Cobalto · principal #2A47DD</span><span>#142A8C</span></div>
</div></body></html>
