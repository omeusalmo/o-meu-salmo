<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#080B1C;font-family:'Instrument Sans',sans-serif;}
  .wrap{padding:22px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
  .btn{display:inline-flex;align-items:center;gap:8px;border:none;cursor:pointer;font-family:inherit;}
  .primary{background:#2A47DD;color:#EEF0FC;border-radius:999px;padding:11px 20px;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(27,51,180,.3);}
  .tri{width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:8px solid #EEF0FC;}
  .ghost{background:transparent;color:#8C97D4;border:.5px solid #1E2348;border-radius:999px;padding:10px 18px;font-size:13px;}
  .play{width:48px;height:48px;border-radius:50%;background:#2A47DD;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 30px rgba(27,51,180,.3);}
</style></head>
<body><div class="wrap">
  <button class="btn primary"><span class="tri"></span>Ouvir</button>
  <button class="btn ghost">Salvar</button>
  <div class="play"><span class="tri"></span></div>
</div></body></html>
