<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@1,400&family=Playfair+Display:ital,wght@0,600;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1920px; overflow:hidden; }
.ad { width:1080px; height:1920px; position:relative; background:radial-gradient(120% 70% at 50% 0%, #182a6e 0%, #10142C 40%, #080B1C 100%); }
.bookmark { position:absolute; top:0; left:50%; transform:translateX(-50%); width:34px; height:50px; background:#5567EA; opacity:.85; clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%); }
.top { position:absolute; top:110px; left:0; right:0; text-align:center; }
.eyebrow { font-family:'Instrument Sans',sans-serif; font-weight:600; font-size:24px; letter-spacing:5px; text-transform:uppercase; color:#FFFFFF; opacity:.4; }
.label { font-family:'Instrument Sans',sans-serif; font-weight:400; font-size:26px; color:#8C97D4; margin-top:18px; }
.label b { color:#EEF0FC; font-weight:500; }
.reader { position:absolute; top:560px; left:96px; right:64px; height:760px; overflow:hidden; }
.stack { position:relative; }
.row { display:flex; align-items:baseline; gap:22px; min-height:150px; padding-left:16px; border-left:3px solid transparent; }
.num { font-family:'Instrument Sans',sans-serif; font-size:22px; color:#5567EA; padding-top:4px; width:28px; }
.txt { font-family:'Cormorant',serif; font-style:italic; font-weight:400; font-size:46px; line-height:1.35; }
.active { border-left-color:#5567EA; transform:translateX(10px); }
.active .txt { color:#C4A86A; }
.dim .txt { color:#8C97D4; opacity:.45; }
.bottom { position:absolute; left:64px; right:64px; bottom:100px; }
.chips { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:36px; justify-content:center; }
.chip { font-family:'Instrument Sans',sans-serif; font-weight:500; font-size:21px; border:1px solid; border-radius:999px; padding:9px 24px; }
.cta {
  display:flex; align-items:center; justify-content:center; gap:14px;
  background:#C4A86A; border-radius:24px; padding:30px 0;
  transform:scale(1.045); box-shadow:0 24px 60px -12px rgba(196,168,106,.5);
}
.cta-txt { font-family:'Instrument Sans',sans-serif; font-weight:700; font-size:38px; letter-spacing:.2px; color:#050714; }
.cta-arrow { font-family:'Instrument Sans',sans-serif; font-weight:700; font-size:38px; color:#050714; }
</style></head><body>
<div class="ad">
  <div class="bookmark"></div>
  <div class="top">
    <div class="eyebrow">O Meu Salmo</div>
    <div class="label">Salmo 23 &middot; <b>O Senhor é o Meu Pastor</b></div>
  </div>
  <div class="reader"><div class="stack" style="top:-230px">
    <div class="row dim"><div class="num">1</div><div class="txt">O Senhor é o meu pastor;</div></div>
    <div class="row dim"><div class="num">2</div><div class="txt">nada me faltará.</div></div>
    <div class="row dim"><div class="num">3</div><div class="txt">Deitar-me faz em pastos verdejantes;</div></div>
    <div class="row active"><div class="num">4</div><div class="txt">guia-me mansamente a águas tranquilas.</div></div>
    <div class="row dim"><div class="num">5</div><div class="txt">Refrigera a minha alma;</div></div>
    <div class="row dim"><div class="num">6</div><div class="txt">guia-me nas veredas da justiça.</div></div>
  </div></div>
  <div class="bottom">
    <div class="chips">
      <span class="chip" style="color:#8B9AF2;border-color:#8B9AF255;background:#8B9AF21f">Ansiedade</span>
      <span class="chip" style="color:#8FC287;border-color:#8FC28755;background:#8FC2871f">Sono</span>
      <span class="chip" style="color:#E2B95C;border-color:#E2B95C55;background:#E2B95C1f">Gratidão</span>
      <span class="chip" style="color:#C793B1;border-color:#C793B155;background:#C793B11f">Luto</span>
    </div>
    <div class="cta"><span class="cta-txt">Baixar grátis</span><span class="cta-arrow">&rarr;</span></div>
  </div>
</div>
</body></html>
