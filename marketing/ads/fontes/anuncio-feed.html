<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.ad {
  width:1080px; height:1350px; position:relative;
  background:#080B1C;
}
.shot {
  position:absolute; inset:0; width:1080px; height:1350px;
  object-fit:cover; object-position:top;
}
.scrim-top {
  position:absolute; top:0; left:0; right:0; height:1350px;
  background:linear-gradient(180deg, #050714 0%, #050714 36%, rgba(5,7,20,0) 50%);
}
.scrim-bottom {
  position:absolute; left:0; right:0; bottom:0; height:520px;
  background:linear-gradient(0deg, #050714 0%, #050714 35%, rgba(5,7,20,0) 100%);
}
.top { position:absolute; top:90px; left:72px; right:72px; }
.eyebrow {
  font-family:'Instrument Sans',sans-serif; font-weight:600; font-size:24px;
  letter-spacing:5px; text-transform:uppercase; color:#FFFFFF; opacity:.55;
}
h1 {
  font-family:'Playfair Display',serif; font-weight:600; font-size:72px;
  color:#FFFFFF; line-height:1.02; letter-spacing:-.015em; margin-top:22px;
  text-shadow:0 4px 30px rgba(0,0,0,.4);
}
h1 em { font-style:italic; color:#8B9AF2; }
.bottom { position:absolute; left:72px; right:72px; bottom:60px; }
.chips { display:flex; flex-wrap:wrap; gap:14px; margin-bottom:28px; }
.chip {
  font-family:'Instrument Sans',sans-serif; font-weight:500; font-size:23px; border:1px solid;
  border-radius:999px; padding:11px 28px;
}
.pill {
  display:inline-block; font-family:'Instrument Sans',sans-serif; font-weight:600; font-size:25px;
  letter-spacing:.5px; color:#EEF0FC; background:#5567EA; border-radius:999px; padding:16px 38px;
}
</style></head><body>
<div class="ad">
  <img class="shot" src="screenshot-feed-crop.png">
  <div class="scrim-top"></div>
  <div class="scrim-bottom"></div>
  <div class="top">
    <div class="eyebrow">O Meu Salmo</div>
    <h1>O Salmo certo<br>pra cada <em>emoção.</em></h1>
  </div>
  <div class="bottom">
    <div class="chips">
      <span class="chip" style="color:#8B9AF2;border-color:#8B9AF255;background:#8B9AF21f">Ansiedade</span>
      <span class="chip" style="color:#8FC287;border-color:#8FC28755;background:#8FC2871f">Sono</span>
      <span class="chip" style="color:#E2B95C;border-color:#E2B95C55;background:#E2B95C1f">Gratidão</span>
      <span class="chip" style="color:#C793B1;border-color:#C793B155;background:#C793B11f">Luto</span>
    </div>
    <span class="pill">Baixe grátis</span>
  </div>
</div>
</body></html>
