<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background: linear-gradient(158deg, #060E1E 0%, #0A1628 40%, #0E1E3C 70%, #1A2E58 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:110px 100px;
  position:relative;
}
/* Shield glow */
.glow {
  position:absolute;
  width:600px; height:600px;
  background: radial-gradient(ellipse, rgba(30,64,175,0.08) 0%, transparent 70%);
  top:50%; left:50%; transform:translate(-50%,-50%);
}
.watermark {
  font-family:'Cormorant Garamond', serif;
  font-size:380px; font-weight:300;
  color:#1E40AF; opacity:0.08;
  position:absolute;
  bottom:-60px; right:-20px;
  line-height:1; user-select:none;
  letter-spacing:-20px;
}
.accent-bar {
  position:absolute; top:0; left:0; right:0;
  height:3px;
  background: linear-gradient(90deg, transparent 0%, #3B82F6 40%, #3B82F6 60%, transparent 100%);
  opacity:0.45;
}
.logo {
  position:absolute; top:52px; left:64px;
  font-family:'DM Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#FFFFFF; opacity:0.22;
  letter-spacing:2.5px; text-transform:uppercase;
}
.corner-num {
  position:absolute; top:44px; right:60px;
  font-family:'Cormorant Garamond', serif;
  font-size:28px; font-weight:300;
  color:#60A5FA; opacity:0.4;
  letter-spacing:1px;
}
.collection-tag {
  font-family:'DM Sans', sans-serif;
  font-size:22px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:#60A5FA; opacity:0.85;
  margin-bottom:44px;
}
.deco-line {
  width:50px; height:1px;
  background: linear-gradient(90deg, transparent, #60A5FA, transparent);
  opacity:0.45; margin: 0 auto 44px;
}
.verse {
  font-family:'Cormorant Garamond', serif;
  font-size:80px; font-weight:300; font-style:italic;
  color:#FFFFFF; line-height:1.58;
  text-align:center;
  max-width:830px;
}
.ref-wrap {
  margin-top:52px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.ref-line {
  width:24px; height:1px;
  background:#C9A96E; opacity:0.45;
}
.ref {
  font-family:'DM Sans', sans-serif;
  font-size:26px; font-weight:300;
  color:#C9A96E; opacity:0.85;
  letter-spacing:1.5px;
}
</style></head><body>
<div class="slide">
  <div class="accent-bar"></div>
  <div class="glow"></div>
  <div class="watermark">91</div>
  <div class="logo">O Meu Salmo</div>
  <div class="corner-num">Salmo 91</div>
  <div class="collection-tag">Proteção</div>
  <div class="deco-line"></div>
  <div class="verse">"O que habita no esconderijo<br>do Altíssimo,<br>à sombra do Onipotente<br>descansará."</div>
  <div class="ref-wrap">
    <div class="ref-line"></div>
    <div class="ref">Salmos 91:1</div>
  </div>
</div>
</body></html>
