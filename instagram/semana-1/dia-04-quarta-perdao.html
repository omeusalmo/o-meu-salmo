<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background: linear-gradient(158deg, #080B1C 0%, #150A28 45%, #1A0A1E 80%, #080B1C 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:110px 100px;
  position:relative;
}
.watermark {
  font-family:'Cormorant', serif;
  font-size:380px; font-weight:300;
  color:#FDA4AF; opacity:0.04;
  position:absolute;
  bottom:-60px; right:-20px;
  line-height:1; user-select:none;
  letter-spacing:-20px;
}
.accent-bar {
  position:absolute; top:0; left:0; right:0;
  height:3px;
  background: linear-gradient(90deg, transparent 0%, #FDA4AF 40%, #FDA4AF 60%, transparent 100%);
  opacity:0.4;
}
.logo {
  position:absolute; top:52px; left:64px;
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#FFFFFF; opacity:0.22;
  letter-spacing:2.5px; text-transform:uppercase;
}
.corner-num {
  position:absolute; top:44px; right:60px;
  font-family:'Cormorant', serif;
  font-size:28px; font-weight:300;
  color:#FDA4AF; opacity:0.4;
  letter-spacing:1px;
}
.collection-tag {
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:#FDA4AF; opacity:0.85;
  margin-bottom:44px;
}
.deco-line {
  width:50px; height:1px;
  background: linear-gradient(90deg, transparent, #FDA4AF, transparent);
  opacity:0.45; margin: 0 auto 44px;
}
.verse {
  font-family:'Cormorant', serif;
  font-size:82px; font-weight:300; font-style:italic;
  color:#FFFFFF; line-height:1.55;
  text-align:center;
  max-width:820px;
}
.ref-wrap {
  margin-top:52px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.ref-line {
  width:24px; height:1px;
  background:#C4A86A; opacity:0.45;
}
.ref {
  font-family:'Instrument Sans', sans-serif;
  font-size:26px; font-weight:300;
  color:#C4A86A; opacity:0.85;
  letter-spacing:1.5px;
}
</style></head><body>
<div class="slide">
  <div class="accent-bar"></div>
  <div class="watermark">51</div>
  <div class="logo">O Meu Salmo</div>
  <div class="corner-num">Salmo 51</div>
  <div class="collection-tag">Perdão</div>
  <div class="deco-line"></div>
  <div class="verse">"Tem misericórdia de mim,<br>ó Deus, segundo<br>a tua benignidade."</div>
  <div class="ref-wrap">
    <div class="ref-line"></div>
    <div class="ref">Salmos 51:1</div>
  </div>
</div>
</body></html>
