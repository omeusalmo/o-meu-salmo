<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background: linear-gradient(162deg, #060912 0%, #0A0E20 40%, #0D1235 70%, #080B1C 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:110px 100px;
  position:relative;
}
/* Stars — subtle dots */
.stars {
  position:absolute; inset:0;
  background-image:
    radial-gradient(1px 1px at 15% 20%, rgba(255,255,255,0.25) 0%, transparent 100%),
    radial-gradient(1px 1px at 72% 14%, rgba(255,255,255,0.18) 0%, transparent 100%),
    radial-gradient(1px 1px at 88% 38%, rgba(255,255,255,0.22) 0%, transparent 100%),
    radial-gradient(1px 1px at 32% 78%, rgba(255,255,255,0.15) 0%, transparent 100%),
    radial-gradient(1px 1px at 58% 88%, rgba(255,255,255,0.20) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 45% 10%, rgba(255,255,255,0.28) 0%, transparent 100%),
    radial-gradient(1px 1px at 92% 65%, rgba(255,255,255,0.15) 0%, transparent 100%);
}
.watermark {
  font-family:'Cormorant', serif;
  font-size:380px; font-weight:300;
  color:#312E81; opacity:0.12;
  position:absolute;
  bottom:-60px; right:-20px;
  line-height:1; user-select:none;
  letter-spacing:-20px;
}
.accent-bar {
  position:absolute; top:0; left:0; right:0;
  height:3px;
  background: linear-gradient(90deg, transparent 0%, #818CF8 40%, #818CF8 60%, transparent 100%);
  opacity:0.35;
}
.logo {
  position:absolute; top:52px; left:64px;
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#FFFFFF; opacity:0.22;
  letter-spacing:2.5px; text-transform:uppercase;
}
.corner-num {
  position:absolute; top:44px; right:60px;
  font-family:'Cormorant', serif;
  font-size:28px; font-weight:300;
  color:#818CF8; opacity:0.35;
  letter-spacing:1px;
}
.collection-tag {
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:#818CF8; opacity:0.75;
  margin-bottom:44px;
}
.deco-line {
  width:50px; height:1px;
  background: linear-gradient(90deg, transparent, #818CF8, transparent);
  opacity:0.4; margin: 0 auto 44px;
}
.verse {
  font-family:'Cormorant', serif;
  font-size:84px; font-weight:300; font-style:italic;
  color:#E8ECF8; line-height:1.6;
  text-align:center;
  max-width:820px;
}
.ref-wrap {
  margin-top:52px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.ref-line {
  width:24px; height:1px;
  background:#C4A86A; opacity:0.4;
}
.ref {
  font-family:'Instrument Sans', sans-serif;
  font-size:26px; font-weight:300;
  color:#C4A86A; opacity:0.8;
  letter-spacing:1.5px;
}
</style></head><body>
<div class="slide">
  <div class="accent-bar"></div>
  <div class="stars"></div>
  <div class="watermark">4</div>
  <div class="logo">O Meu Salmo</div>
  <div class="corner-num">Salmo 4</div>
  <div class="collection-tag">Sono</div>
  <div class="deco-line"></div>
  <div class="verse">"Em paz me deito<br>e logo adormeço,<br>pois só tu, Senhor,<br>me fazes habitar em segurança."</div>
  <div class="ref-wrap">
    <div class="ref-line"></div>
    <div class="ref">Salmos 4:8</div>
  </div>
</div>
</body></html>
