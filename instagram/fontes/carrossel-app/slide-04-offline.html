<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background: linear-gradient(155deg, #080B1C 0%, #10142C 55%, #141a38 80%, #22307c 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:120px 100px; position:relative; text-align:center;
}
.logo { position:absolute; top:72px; left:0; right:0; font-family:'Instrument Sans',sans-serif;
  font-size:22px; font-weight:500; color:#FFF; opacity:0.25; letter-spacing:5px; text-transform:uppercase; }
.progress { position:absolute; top:64px; right:72px; font-family:'Instrument Sans',sans-serif;
  font-size:22px; color:#FFF; opacity:0.30; letter-spacing:3px; }
.eyebrow { font-family:'Instrument Sans',sans-serif; font-size:24px; font-weight:500;
  letter-spacing:7px; text-transform:uppercase; color:#5567EA; margin-bottom:48px; }
.title { font-family:'Playfair Display',serif; font-size:92px; font-weight:400;
  color:#EEF0FC; line-height:1.25; }
.title em { font-style:italic; color:#5567EA; }
.sub { font-family:'Cormorant',serif; font-style:italic; font-size:44px; font-weight:300;
  color:#8C97D4; line-height:1.5; margin-top:44px; max-width:820px; }
.chips { display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin-top:56px; max-width:840px; }
.chip { font-family:'Instrument Sans',sans-serif; font-size:26px; color:#EEF0FC;
  border:1px solid rgba(85,103,234,.55); border-radius:999px; padding:14px 34px; }
.cue { position:absolute; bottom:72px; left:0; right:0; font-family:'Instrument Sans',sans-serif;
  font-size:24px; color:#FFF; opacity:0.35; letter-spacing:2px; }
.gold { color:#C4A86A; }
.url { font-family:'Instrument Sans',sans-serif; font-size:30px; color:#C4A86A; margin-top:56px; letter-spacing:1px; }
.mark { font-family:'Playfair Display',serif; font-size:400px; color:#5567EA; opacity:0.05;
  position:absolute; bottom:-90px; right:-30px; line-height:1; }

.bookmark{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:50px;background:#5567EA;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);opacity:0.9;}
</style></head><body>
<div class="slide">
  <div class="bookmark"></div>
  <div class="logo">O Meu Salmo</div>
  <div class="progress">3 de 3</div>
  <div class="title">Offline. Grátis.<br><em>Sem anúncios.</em></div>
  <div class="sub">Sem cadastro. Sem distração.<br>Só você e a Palavra.</div>
  
</div>
</body></html>
