<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1350px;overflow:hidden;}
.wrap{width:1080px;height:1350px;position:relative;background:radial-gradient(120% 60% at 50% 100%,#e8ecfb 0%,#dfe4fa 45%,#d3d9f4 100%);overflow:hidden;}
.bookmark{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:50px;background:#2A47DD;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);}
.counter{position:absolute;top:56px;right:64px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:1px;color:#6E78B8;}
.brand{position:absolute;top:66px;left:64px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:20px;letter-spacing:3px;text-transform:uppercase;color:#6E78B8;}
.eyebrow{position:absolute;top:320px;left:96px;right:96px;text-align:center;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:24px;letter-spacing:5px;text-transform:uppercase;color:#2A47DD;}
.hl{position:absolute;top:400px;left:96px;right:96px;text-align:center;font-family:'Playfair Display',serif;font-weight:600;font-size:74px;line-height:1.08;color:#0C1230;}
.hl em{font-style:italic;color:#2A47DD;}
.sub{position:absolute;top:730px;left:130px;right:130px;text-align:center;font-family:'Playfair Display',serif;font-style:italic;font-size:34px;color:#3E4A96;line-height:1.4;}
.btn{position:absolute;left:96px;right:96px;top:960px;display:flex;align-items:center;justify-content:center;gap:14px;background:#2A47DD;border-radius:22px;padding:32px 0;box-shadow:0 24px 60px -14px rgba(42,71,221,.4);}
.btn span{font-family:'Instrument Sans',sans-serif;font-weight:700;font-size:38px;color:#F5F7FF;}
.micro{position:absolute;left:0;right:0;top:1110px;text-align:center;font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:22px;color:#6B4E1C;letter-spacing:.3px;}
.num{position:absolute;bottom:-60px;right:-20px;font-family:'Playfair Display',serif;font-weight:600;font-size:420px;color:#2A47DD;opacity:.08;}
</style></head><body>
<div class="wrap">
  <div class="num">150</div>
  <div class="bookmark"></div>
  <div class="brand">O MEU SALMO</div>
  <div class="counter">6 / 6</div>
  <div class="eyebrow">A partir de hoje</div>
  <div class="hl">Baixe <em>grátis</em><br>e comece agora.</div>
  <div class="sub">O Salmo certo pra cada emoção,<br>sempre com você.</div>
  <div class="btn"><span>Baixar na Play Store</span></div>
  <div class="micro">Grátis · Offline · Sem anúncios</div>
</div></body></html>
