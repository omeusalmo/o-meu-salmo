<!DOCTYPE html><html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1350px;overflow:hidden;}
.wrap{width:1080px;height:1350px;position:relative;background:#080B1C;overflow:hidden;}
.shot{position:absolute;top:0;left:0;width:1080px;height:1150px;overflow:hidden;}
.shot img{position:absolute;top:0;left:0;width:1080px;}
.fade{position:absolute;top:1080px;left:0;width:1080px;height:70px;background:linear-gradient(#080B1C00,#080B1C);}
.counter{position:absolute;bottom:44px;right:44px;font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:20px;letter-spacing:1px;color:#EEF0FC;background:rgba(85,103,234,.16);border:1px solid rgba(238,240,252,.18);border-radius:999px;padding:9px 20px;z-index:2;}
</style></head><body>
<div class="wrap">
  <div class="shot"><img src="crops/s2-home.png"></div>
  <div class="fade"></div>
  <div class="counter">2 / 6</div>
</div></body></html>
