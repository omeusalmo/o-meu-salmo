<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background: linear-gradient(160deg, #10142C 0%, #22307c 60%, #1E4080 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:100px; position:relative;
}
.tag {
  font-family:'Instrument Sans', sans-serif;
  font-size:24px; font-weight:500;
  letter-spacing:3px; text-transform:uppercase;
  color:#A78BFA; opacity:0.8; margin-bottom:50px;
}
.deco { width:40px; height:1px; background:#A78BFA; opacity:0.4; margin:0 auto 50px; }
.title {
  font-family:'Cormorant', serif;
  font-size:104px; font-weight:300; font-style:italic;
  color:#FFFFFF; line-height:1.3; text-align:center;
  margin-bottom:60px;
}
.features {
  display:flex; flex-direction:column; gap:18px;
  align-items:center;
}
.feature {
  font-family:'Instrument Sans', sans-serif;
  font-size:32px; font-weight:300;
  color:#FFFFFF; opacity:0.7;
  letter-spacing:1px;
}
.sep { color:#A78BFA; opacity:0.4; margin: 0 12px; }
.url {
  margin-top:60px;
  font-family:'Instrument Sans', sans-serif;
  font-size:28px; font-weight:400;
  color:#C4A86A; opacity:0.8;
  letter-spacing:2px;
}
.brand {
  margin-top:16px;
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#FFFFFF; opacity:0.25;
  letter-spacing:2px; text-transform:uppercase;
}
.save-cue{margin-top:48px;font-family:'DM Sans',sans-serif;font-size:24px;color:#C4A86A;opacity:0.75;letter-spacing:1px;}
</style></head><body>
<div class="slide">
  <div class="tag">O Meu Salmo</div>
  <div class="deco"></div>
  <div class="title">150 Salmos.<br>8 emoções.<br>Narração em áudio.</div>
  <div class="features">
    <div class="feature">Ansiedade <span class="sep">·</span> Sono <span class="sep">·</span> Gratidão <span class="sep">·</span> Luto</div>
    <div class="feature">Esperança <span class="sep">·</span> Perdão <span class="sep">·</span> Louvor <span class="sep">·</span> Proteção</div>
  </div>
  <div class="save-cue">Salve este post para quando precisar.</div>
  <div class="url">omeusalmo.com.br</div>
  <div class="brand">Gratuito · Android</div>
</div>
</body></html>
