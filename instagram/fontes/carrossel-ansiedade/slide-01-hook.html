<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background: linear-gradient(160deg, #080B1C 0%, #10142C 50%, #22307c 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:90px;
  position:relative;
}
.tag {
  font-family:'Instrument Sans', sans-serif;
  font-size:26px; font-weight:500;
  letter-spacing:3px; text-transform:uppercase;
  color:#A78BFA; opacity:0.9;
  margin-bottom:40px;
}
.headline {
  font-family:'Cormorant', serif;
  font-size:92px; font-weight:300; font-style:italic;
  color:#FFFFFF; line-height:1.25;
  text-align:center;
}
.headline em { font-style:normal; font-weight:400; color:#A78BFA; }
.swipe {
  position:absolute; bottom:60px;
  font-family:'Instrument Sans', sans-serif;
  font-size:26px; font-weight:300;
  color:#FFFFFF; opacity:0.3;
  letter-spacing:2px;
}
.logo {
  position:absolute; top:50px; left:60px;
  font-family:'Instrument Sans', sans-serif;
  font-size:24px; font-weight:500;
  color:#FFFFFF; opacity:0.25;
  letter-spacing:1px; text-transform:uppercase;
}
.deco {
  width:40px; height:1px;
  background:#A78BFA; opacity:0.5;
  margin: 0 auto 40px;
}
</style></head><body>
<div class="slide">
  <div class="logo">O Meu Salmo</div>
  <div class="tag">Coleção Ansiedade</div>
  <div class="deco"></div>
  <div class="headline">Quando a ansiedade<br>aperta o peito…<br><em>há salmos escritos<br>exatamente para isso.</em></div>
  <div class="swipe">deslize →</div>
</div>
</body></html>
