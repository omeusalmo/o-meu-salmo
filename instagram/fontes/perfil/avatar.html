<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
/* Avatar IG — derivado 1:1 do brand (O meu Salmo - App Icon.html), texto ampliado pro círculo */
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; }
.icon {
  width:1080px; height:1080px; position:relative;
  background:linear-gradient(157deg, #3150E8 0%, #2A47DD 46%, #1B33B4 100%);
  display:flex; align-items:center; justify-content:center;
}
.ribbon {
  position:absolute; top:0; left:80%; transform:translateX(-50%);
  width:120px; height:210px; background:#FFFFFF;
}
.ribbon:after {
  content:""; position:absolute; left:0; right:0; bottom:0; height:70px;
  background:#1B33B4;
  clip-path:polygon(0 100%, 50% 38%, 100% 100%);
}
.wm { display:flex; flex-direction:column; align-items:center; gap:34px; margin-top:30px; }
.wm .eye {
  font-family:'Instrument Sans',sans-serif; font-weight:500;
  font-size:78px; letter-spacing:.46em; padding-left:.46em;
  text-transform:uppercase; color:#FFFFFF; opacity:.92;
}
.wm .word {
  font-family:'Playfair Display',serif; font-style:italic; font-weight:400;
  font-size:330px; line-height:.9; letter-spacing:-.015em; color:#FFFFFF;
}
</style></head><body>
<div class="icon">
  <div class="ribbon"></div>
  <div class="wm"><span class="eye">O meu</span><span class="word">Salmo</span></div>
</div>
</body></html>
