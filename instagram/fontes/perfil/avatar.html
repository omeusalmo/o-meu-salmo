<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500&family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1080px; overflow:hidden; }
.avatar {
  width:1080px; height:1080px;
  background: radial-gradient(circle at 50% 30%, #3a52e0 0%, #2A47DD 45%, #1B33B4 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative;
}
.bookmark {
  position:absolute; top:0; left:50%; transform:translateX(-50%);
  width:110px; height:170px; background:#FFFFFF; opacity:0.95;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%);
}
.nome {
  font-family:'Playfair Display', serif;
  font-style:italic; font-weight:500;
  font-size:300px; color:#FFFFFF;
  line-height:1; margin-top:60px;
  letter-spacing:-6px;
}
</style></head><body>
<div class="avatar">
  <div class="bookmark"></div>
  <div class="nome">Salmo</div>
</div>
</body></html>
