<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background:linear-gradient(155deg, #FDF9F0 0%, #FAF2E0 55%, #F0E4C8 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:110px 100px;
  position:relative;
}
.watermark {
  font-family:'Cormorant', serif;
  font-size:380px; font-weight:300;
  color:#C99A38; opacity:0.09;
  position:absolute;
  bottom:-60px; right:-20px;
  line-height:1; user-select:none;
  letter-spacing:-20px;
}
.accent-bar {
  position:absolute; top:0; left:0; right:0;
  height:3px;
  background: linear-gradient(90deg, transparent 0%, #C99A38 40%, #C99A38 60%, transparent 100%);
  opacity:0.45;
}
.logo {
  position:absolute; top:52px; left:64px;
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#4E5899; opacity:0.45;
  letter-spacing:2.5px; text-transform:uppercase;
}
.collection-tag {
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:#7A5A18; opacity:0.85;
  margin-bottom:44px;
}
.deco-line {
  width:50px; height:1px;
  background: linear-gradient(90deg, transparent, #C99A38, transparent);
  opacity:0.5; margin: 0 auto 44px;
}
.verse {
  font-family:'Cormorant', serif;
  font-size:82px; font-weight:300; font-style:italic;
  color:#0C1230; line-height:1.55;
  text-align:center;
  max-width:820px;
}
.ref-wrap {
  margin-top:52px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.ref-line {
  width:24px; height:1px;
  background:#8A6A28; opacity:0.45;
}
.ref {
  font-family:'Instrument Sans', sans-serif;
  font-size:26px; font-weight:300;
  color:#8A6A28; opacity:0.85;
  letter-spacing:1.5px;
}
.bookmark{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:50px;background:#2A47DD;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);opacity:0.85;}
</style></head><body>
<div class="slide">
  <div class="bookmark"></div>
  <div class="accent-bar"></div>
  <div class="watermark">100</div>
  <div class="logo">O Meu Salmo</div>
  <div class="collection-tag">Gratidão</div>
  <div class="deco-line"></div>
  <div class="verse">"Servi ao Senhor com alegria;<br>entrai diante dele<br>com cântico."</div>
  <div class="ref-wrap">
    <div class="ref-line"></div>
    <div class="ref">Salmos 100:2</div>
  </div>
</div>
</body></html>
