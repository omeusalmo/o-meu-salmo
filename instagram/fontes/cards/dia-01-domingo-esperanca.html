<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background:linear-gradient(155deg, #F4F6FE 0%, #E6EAFD 55%, #D4DCF8 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:110px 100px;
  position:relative;
}
/* Ghost number watermark */
.watermark {
  font-family:'Cormorant', serif;
  font-size:380px; font-weight:300;
  color:#2A47DD; opacity:0.09;
  position:absolute;
  bottom:-60px; right:-20px;
  line-height:1; user-select:none;
  letter-spacing:-20px;
}
/* Top accent bar */
.accent-bar {
  position:absolute; top:0; left:0; right:0;
  height:3px;
  background: linear-gradient(90deg, transparent 0%, #2A47DD 40%, #2A47DD 60%, transparent 100%);
  opacity:0.5;
}
.logo {
  position:absolute; top:52px; left:64px;
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#4E5899; opacity:0.45;
  letter-spacing:2.5px; text-transform:uppercase;
}
.collection-tag {
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:#2A47DD; opacity:0.85;
  margin-bottom:44px;
}
.deco-line {
  width:50px; height:1px;
  background: linear-gradient(90deg, transparent, #2A47DD, transparent);
  opacity:0.5; margin: 0 auto 44px;
}
.verse {
  font-family:'Cormorant', serif;
  font-size:86px; font-weight:300; font-style:italic;
  color:#0C1230; line-height:1.55;
  text-align:center;
  max-width:920px;
}
.ref-wrap {
  margin-top:52px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.ref-line {
  width:24px; height:1px;
  background:#8A6A28; opacity:0.45;
}
.ref {
  font-family:'Instrument Sans', sans-serif;
  font-size:26px; font-weight:300;
  color:#8A6A28; opacity:0.85;
  letter-spacing:1.5px;
}
</style></head><body>
<div class="slide">
  <div class="accent-bar"></div>
  <div class="watermark">23</div>
  <div class="logo">O Meu Salmo</div>
  <div class="collection-tag">Esperança</div>
  <div class="deco-line"></div>
  <div class="verse">"O Senhor é o meu pastor;<br>nada me faltará."</div>
  <div class="ref-wrap">
    <div class="ref-line"></div>
    <div class="ref">Salmos 23:1</div>
  </div>
</div>
</body></html>
