<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background:linear-gradient(155deg, #080B1C 0%, #10142C 45%, #2a2418 78%, #4a3a14 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:110px 100px 180px;
  position:relative;
}
.watermark {
  font-family:'Cormorant', serif;
  font-size:380px; font-weight:300;
  color:#E0B95C; opacity:0.05;
  position:absolute;
  bottom:200px; right:-30px;
  line-height:1; user-select:none;
  letter-spacing:-20px;
}
.accent-bar {
  position:absolute; top:0; left:0; right:0;
  height:3px;
  background: linear-gradient(90deg, transparent 0%, #E0B95C 40%, #E0B95C 60%, transparent 100%);
  opacity:0.6;
}
.logo {
  position:absolute; top:52px; left:64px;
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#FFFFFF; opacity:0.22;
  letter-spacing:2.5px; text-transform:uppercase;
}
.corner-num {
  position:absolute; top:44px; right:60px;
  font-family:'Cormorant', serif;
  font-size:28px; font-weight:300;
  color:#E0B95C; opacity:0.4;
  letter-spacing:1px;
}
.collection-tag {
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  letter-spacing:4px; text-transform:uppercase;
  color:#E0B95C; opacity:0.9;
  margin-bottom:44px;
}
.deco-line {
  width:50px; height:1px;
  background: linear-gradient(90deg, transparent, #E0B95C, transparent);
  opacity:0.5; margin: 0 auto 44px;
}
.verse {
  font-family:'Cormorant', serif;
  font-size:82px; font-weight:300; font-style:italic;
  color:#EEF0FC; line-height:1.55;
  text-align:center;
  max-width:840px;
}
.ref-wrap {
  margin-top:52px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.ref-line {
  width:24px; height:1px;
  background:#C4A86A; opacity:0.45;
}
.ref {
  font-family:'Instrument Sans', sans-serif;
  font-size:26px; font-weight:300;
  color:#C4A86A; opacity:0.85;
  letter-spacing:1.5px;
}
.bookmark{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:50px;background:#E0B95C;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);opacity:0.9;}
.cvv {
  position:absolute; left:0; right:0; bottom:0;
  padding:34px 100px 40px;
  border-top:1px solid rgba(224,185,92,0.28);
  background:rgba(8,11,28,0.45);
  display:flex; align-items:baseline; justify-content:center; gap:20px;
}
.cvv-num {
  font-family:'Playfair Display', serif;
  font-size:76px; font-weight:400;
  color:#E0B95C; letter-spacing:2px;
  line-height:1;
}
.cvv-txt {
  font-family:'Instrument Sans', sans-serif;
  font-size:25px; font-weight:400;
  color:#EEF0FC; opacity:0.72;
  line-height:1.45; max-width:520px;
}
.cvv-txt b { font-weight:500; opacity:1; }
</style></head><body>
<div class="slide">
  <div class="bookmark"></div>
  <div class="accent-bar"></div>
  <div class="watermark">40</div>
  <div class="logo">O Meu Salmo</div>
  <div class="corner-num">Salmo 40</div>
  <div class="collection-tag">Setembro Amarelo</div>
  <div class="deco-line"></div>
  <div class="verse">"Ele se inclinou<br>para mim e ouviu<br>o meu clamor."</div>
  <div class="ref-wrap">
    <div class="ref-line"></div>
    <div class="ref">Salmos 40:1</div>
  </div>
  <div class="cvv">
    <div class="cvv-num">188</div>
    <div class="cvv-txt"><b>CVV.</b> Gratuito, 24 horas, sigiloso.<br>Chat e e-mail em cvv.org.br</div>
  </div>
</div>
</body></html>
