<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300;0,400;1,300;1,400&family=Instrument+Sans:wght@400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1080px; height:1350px; overflow:hidden; }
.slide {
  width:1080px; height:1350px;
  background:linear-gradient(155deg, #F4F6FE 0%, #E6EAFD 55%, #D4DCF8 100%);
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:110px 100px;
  position:relative; text-align:center;
}
.watermark {
  font-family:'Cormorant', serif;
  font-size:380px; font-weight:300;
  color:#2A47DD; opacity:0.08;
  position:absolute;
  bottom:-60px; right:-20px;
  line-height:1; user-select:none;
  letter-spacing:-20px;
}
.accent-bar {
  position:absolute; top:0; left:0; right:0;
  height:3px;
  background: linear-gradient(90deg, transparent 0%, #2A47DD 40%, #2A47DD 60%, transparent 100%);
  opacity:0.5;
}
.logo {
  position:absolute; top:52px; left:0; right:0;
  font-family:'Instrument Sans', sans-serif;
  font-size:22px; font-weight:500;
  color:#4E5899; opacity:0.5;
  letter-spacing:2.5px; text-transform:uppercase;
}
.eyebrow {
  font-family:'Instrument Sans', sans-serif;
  font-size:24px; font-weight:500;
  letter-spacing:6px; text-transform:uppercase;
  color:#2A47DD; opacity:0.9;
  margin-bottom:44px;
}
.deco-line {
  width:50px; height:1px;
  background: linear-gradient(90deg, transparent, #2A47DD, transparent);
  opacity:0.5; margin: 0 auto 44px;
}
.title {
  font-family:'Playfair Display', serif;
  font-size:80px; font-weight:400;
  color:#0C1230; line-height:1.28;
  max-width:820px;
}
.title em { font-style:italic; color:#2A47DD; }
.sub {
  font-family:'Cormorant', serif; font-style:italic;
  font-size:42px; font-weight:300;
  color:#2E3A86; line-height:1.5;
  margin-top:40px; max-width:760px;
}
.cta {
  margin-top:64px;
  font-family:'Instrument Sans', sans-serif;
  font-size:28px; font-weight:500;
  color:#F4F6FE; background:#2A47DD;
  border-radius:999px; padding:22px 56px;
  letter-spacing:1px;
}
.bookmark{position:absolute;top:0;left:50%;transform:translateX(-50%);width:34px;height:50px;background:#2A47DD;clip-path:polygon(0 0,100% 0,100% 100%,50% 70%,0 100%);opacity:0.85;}
</style></head><body>
<div class="slide">
  <div class="bookmark"></div>
  <div class="accent-bar"></div>
  <div class="watermark">150</div>
  <div class="logo">O Meu Salmo</div>
  <div class="eyebrow">A partir de hoje</div>
  <div class="deco-line"></div>
  <div class="title">Já está disponível<br>para <em>qualquer pessoa</em><br>baixar.</div>
  <div class="sub">150 Salmos, por emoção,<br>com narração em áudio.</div>
  <div class="cta">Baixar na Play Store</div>
</div>
</body></html>
